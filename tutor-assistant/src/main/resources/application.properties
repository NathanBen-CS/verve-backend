spring.application.name=tutor-assistant

jwt.secret=${JWT_SECRET}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.username=postgres
spring.datasource.password=${DB_PASS}
spring.datasource.url=${DB_URL}

server.port=8080
server.address=0.0.0.0

server.error.include-message=always
spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vervetutor@gmail.com
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.ai.openai.api-key=${OPENAI_KEY}
spring.ai.openai.chat.options.model=gpt-5-chat-latest

stripe.apikey=${STRIPE_PRIVATE}
stripe.webhook.secret=${WEBHOOK}

stripe.starter=price_1RtLcNAL91V32s68avDBYWcR
stripe.pro=price_1RtLdJAL91V32s68wtbYhSUV

